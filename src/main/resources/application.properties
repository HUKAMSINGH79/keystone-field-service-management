spring.application.name=keystone


# Server Configuration

server.port=8081


# MySQL Database Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/keystone_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=8080vikash
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate Configuration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================
# Logging
# ==========================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# ==========================
# JWT Configuration
# ==========================
jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-before-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================
# Spring Security
# ==========================
spring.flyway.enabled=true

# ==========================
# Jackson Configuration
# ==========================
#spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ==========================
# File Upload Configuration
# ==========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
