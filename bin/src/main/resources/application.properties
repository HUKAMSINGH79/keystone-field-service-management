spring.application.name=keystone


# Server Configuration

server.port=8080


# MySQL Database Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/keystone_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate Configuration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# Logging
# ==========================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==========================
# JWT Configuration
# ==========================
jwt.secret=YourVeryStrongSecretKeyForKeystoneProject123456789
jwt.expiration=86400000

# ==========================
# Spring Security
# ==========================
spring.security.user.name=admin
spring.security.user.password=admin123

# ==========================
# Jackson Configuration
# ==========================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ==========================
# File Upload Configuration
# ==========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
